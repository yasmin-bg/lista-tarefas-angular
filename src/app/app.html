<div class="container">

  <h1>Minhas tarefas</h1>

  <div class="adicionar">
    <input
      type="text"
      [(ngModel)]="novaTarefa"
      placeholder="Digite uma nova tarefa..."
      (keyup.enter)="adicionarTarefa()"
    >

    <button (click)="adicionarTarefa()">
      Adicionar
    </button>
  </div>

  <div class="lista-tarefas">

    @for (tarefa of tarefas; track $index) {

      <div class="tarefa">

        <input
          type="checkbox"
          [(ngModel)]="tarefa.concluida"
        >

        <span [class.concluida]="tarefa.concluida">
          {{ tarefa.descricao }}
        </span>

        <button
          class="remover"
          (click)="removerTarefa($index)"
        >
          Remover
        </button>

      </div>

    }

  </div>

  <p class="contador">
    Tarefas concluídas: {{ contarTarefasConcluidas() }}
  </p>

</div>
